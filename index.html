<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Двухнедельный трекер</title>
    <meta name="theme-color" content="#1769f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Мой режим" />
    <link rel="apple-touch-icon" href="app-icon.png" />
    <link rel="icon" type="image/png" href="app-icon.png" />
    <style>
      :root {
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #101828;
        --muted: #667085;
        --line: #e4e7ec;
        --blue: #2463eb;
        --blue-soft: #e9efff;
        --success: #16a34a;
        --warning: #f59e0b;
        --danger: #dc2626;
        --radius: 14px;
        --shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        color: var(--text);
        background: radial-gradient(circle at 10% 0%, #fefefe, var(--bg) 45%);
        font-family: "SF Pro Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      }

      .shell {
        max-width: 1240px;
        margin: 0 auto;
        padding: 20px 22px 40px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      h1, h2, h3 { margin: 0; }
      h1 { font-size: 28px; line-height: 1.1; letter-spacing: -0.2px; }
      .muted { color: var(--muted); font-size: 13px; }

      .btn {
        border: 1px solid var(--line);
        background: #fff;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }
      .btn:hover { background: #f9fbff; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
      .btn-primary:hover { background: #174ed0; }

      .actions { display: flex; gap: 10px; flex-wrap: wrap; }

      .summary {
        margin: 16px 0;
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 12px;
      }
      .summary div {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        box-shadow: var(--shadow);
        min-height: 80px;
      }
      .summary strong { display: block; font-size: 18px; margin-bottom: 4px; }
      .summary span { font-size: 13px; color: var(--muted); }

      .grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(180px, 1fr));
        gap: 14px;
      }
      @media (max-width: 1100px) { .grid { grid-template-columns: repeat(4, minmax(180px, 1fr)); } }
      @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .summary { grid-template-columns: 1fr 1fr; } }

      .day {
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 4px solid #7b89a8;
        border-radius: 14px;
        padding: 12px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .day.today { border-color: var(--blue); border-left-color: var(--blue); }
      .day.rest { border-left-color: var(--warning); }

      .day-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .day-date { font-weight: 700; }
      .weekday { font-size: 13px; color: var(--muted); }
      .status-tag { font-size: 12px; padding: 4px 8px; border-radius: 999px; background: var(--blue-soft); }

      .block { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
      .block strong { color: var(--text); }

      .progress-wrap {
        background: #edf0f7;
        border-radius: 999px;
        height: 8px;
      }
      .progress {
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--blue), #8b5cf6);
      }

      .task-list { display: flex; flex-direction: column; gap: 8px; }
      .task {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        background: #fcfcfd;
      }
      .task-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .task-title { font-size: 13px; line-height: 1.3; }
      .task-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
      .task-actions {
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .task-actions button {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 8px;
        background: #fff;
        font-size: 11px;
      }

      .day-footer { margin-top: auto; display: flex; gap: 8px; }
      .small {
        border: 0;
        background: none;
        color: var(--blue);
        font-size: 12px;
        cursor: pointer;
        padding: 0;
      }

      .footer-note { margin-top: 8px; }
      .note-item { margin: 4px 0; font-size: 12px; color: var(--muted); border-left: 2px solid #d0d5dd; padding-left: 7px; }

      .panel {
        margin-top: 18px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .panel h3 { margin-bottom: 12px; }
      .day-quick {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 20px;
      }
      @media (max-width: 680px) { .day-quick { grid-template-columns: 1fr; } }
      .big-box {
        background: linear-gradient(180deg, #fbfdff, #f4f6fb);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .big-box h4 { margin: 0 0 6px; font-size: 16px; }

      .label { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
      .value { font-size: 22px; font-weight: 700; }
      .warn {
        color: #b45309;
        background: #fffbeb;
        border: 1px solid #fed7aa;
        border-radius: 10px;
        padding: 8px;
        margin-top: 10px;
        font-size: 12px;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(8, 16, 34, 0.4);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
        padding: 10px;
      }
      .modal-backdrop.open { display: flex; }
      .modal {
        width: min(760px, 100%);
        background: #fff;
        border-radius: 16px;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        padding: 16px;
        max-height: 90vh;
        overflow: auto;
      }
      .grid-form {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      @media (max-width: 640px) { .grid-form { grid-template-columns: 1fr; } }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field label { font-size: 12px; color: var(--muted); }
      .field input,
      .field select,
      .field textarea {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        font: inherit;
      }
      .actions-right { text-align: right; margin-top: 12px; }

      .history {
        margin-top: 14px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .history-item {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
        background: #fff;
      }

      .cycle-block-inputs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      @media (max-width: 900px) { .cycle-block-inputs { grid-template-columns: 1fr; } }

      /* Reference-inspired planner layout */
      :root {
        --bg: #f7f9fc;
        --card: #ffffff;
        --text: #10182e;
        --muted: #75829d;
        --line: #e6eaf1;
        --blue: #1769f5;
        --blue-soft: #edf4ff;
        --shadow: 0 5px 18px rgba(29, 48, 83, .055);
        --radius: 12px;
      }

      html, body {
        min-height: 100%;
        background: #fbfcfe;
        font-family: "Aptos", "Segoe UI Variable", "Segoe UI", sans-serif;
      }

      body { padding: 0; }

      .shell {
        max-width: 1920px;
        margin: 0 auto;
        padding: 24px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 332px;
        grid-template-areas:
          "top top"
          "summary side"
          "calendar side"
          "notes notes"
          "history history";
        gap: 18px;
      }

      .top { grid-area: top; min-height: 64px; flex-wrap: nowrap; }
      .top > div:first-child { position: relative; padding-left: 72px; }
      .top > div:first-child::before {
        content: "▦";
        position: absolute;
        left: 0;
        top: -3px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        background: var(--blue);
        font-size: 25px;
        font-weight: 800;
        box-shadow: 0 8px 18px rgba(23, 105, 245, .18);
      }

      h1 { font-size: 29px; letter-spacing: -.75px; font-weight: 750; }
      .top .muted { margin-top: 4px; font-size: 14px; color: #8491aa; }

      .btn {
        min-height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        border-color: #e2e7ef;
        color: #334867;
        box-shadow: 0 2px 7px rgba(24, 39, 75, .035);
        font-weight: 600;
      }
      .btn-primary { color: #fff; box-shadow: 0 7px 16px rgba(23, 105, 245, .2); }
      .btn:hover { border-color: #cfd8e7; background: #f8faff; }
      .btn-primary:hover { background: #0d5ce4; }

      .summary {
        grid-area: summary;
        margin: 0;
        grid-template-columns: repeat(5, minmax(150px, 1fr));
        gap: 14px;
      }
      .summary div {
        min-height: 96px;
        padding: 20px 18px 16px 72px;
        border-radius: 12px;
        box-shadow: var(--shadow);
        position: relative;
      }
      .summary div::before {
        content: "✓";
        position: absolute;
        left: 18px;
        top: 23px;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--blue-soft);
        color: var(--blue);
        font-size: 18px;
        font-weight: 800;
      }
      .summary div:nth-child(1)::before { content: "↻"; font-size: 23px; }
      .summary div:nth-child(2)::before { content: "▣"; }
      .summary div:nth-child(4)::before { content: "↗"; }
      .summary div:nth-child(5)::before { content: "◷"; font-size: 22px; }
      .summary strong { font-size: 19px; line-height: 1.2; margin-bottom: 3px; }
      .summary span { display: block; font-size: 12px; line-height: 1.45; }

      #calendar {
        grid-area: calendar;
        position: relative;
        min-width: 0;
        min-height: 700px;
        overflow-x: auto;
        align-items: stretch;
        padding: 68px 18px 100px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        box-shadow: var(--shadow);
        scrollbar-color: #ccd5e5 transparent;
      }
      #calendar::before {
        content: "План цикла";
        position: absolute;
        left: 22px;
        top: 22px;
        font-size: 16px;
        font-weight: 750;
      }
      #calendar::after {
        content: "14 дней  ·  календарь";
        position: absolute;
        right: 22px;
        top: 18px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: #536581;
        font-size: 12px;
        font-weight: 650;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(196px, 1fr));
        gap: 14px;
      }

      .day:nth-child(8) {
        position: relative;
        margin-top: 46px;
      }
      .day:nth-child(n+9) { margin-top: 46px; }
      .day:nth-child(8)::before {
        content: "Неделя 2";
        position: absolute;
        left: 0;
        top: -34px;
        color: #17233a;
        font-size: 14px;
        font-weight: 750;
      }
      .day:first-child::before {
        content: "Неделя 1";
        position: absolute;
        left: 0;
        top: -34px;
        color: #17233a;
        font-size: 14px;
        font-weight: 750;
      }

      .day {
        position: relative;
        min-height: 560px;
        padding: 14px 12px 12px;
        gap: 11px;
        border: 1px solid var(--line);
        border-left: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: none;
        background: #fff;
      }
      .day:hover { border-color: #bfd0ec; }
      .day.today {
        border: 1.5px solid var(--blue);
        box-shadow: 0 0 0 1px rgba(23, 105, 245, .05);
      }
      .day.rest { background: #fbfcfe; border-left: 1px solid var(--line); }
      .day-head { align-items: flex-start; min-height: 57px; }
      .day-date { font-size: 14px; color: var(--text); }
      .weekday { display: none; }
      .day-head .muted { font-size: 11px; margin-top: 4px; color: #4871b7; }
      .status-tag {
        margin-top: 30px;
        margin-left: -78px;
        white-space: nowrap;
        font-size: 10px;
        padding: 4px 8px;
        color: #3f5d8c;
        background: #edf3fc;
      }

      .day > .task-actions { display: none; }
      .block {
        min-height: 188px;
        padding: 10px 2px 11px;
        border-top: 0;
        border-bottom: 1px solid #edf0f5;
        font-size: 10.5px;
        line-height: 1.75;
        color: #5f6f89;
      }
      .block strong { display: block; margin-bottom: 3px; font-size: 11px; color: #263650; }
      .schedule-row {
        display: grid;
        grid-template-columns: 16px 76px minmax(0, 1fr);
        align-items: center;
        gap: 4px;
        min-height: 20px;
        white-space: nowrap;
      }
      .schedule-row > span { color: #7790b7; font-size: 10px; text-align: center; }
      .schedule-row time { color: #60718d; font-size: 9.5px; font-variant-numeric: tabular-nums; }
      .schedule-row b { overflow: hidden; color: #465974; font-size: 9.5px; font-weight: 550; text-overflow: ellipsis; }

      .task-list { gap: 7px; }
      .task-list::before {
        content: "Задачи дня";
        display: block;
        margin: 1px 0 2px;
        color: #263650;
        font-size: 11px;
        font-weight: 750;
      }
      .task {
        position: relative;
        padding: 10px 30px 9px 38px;
        min-height: 54px;
        border-color: #e9edf3;
        border-radius: 9px;
        background: #fff;
      }
      .task::before {
        content: "▤";
        position: absolute;
        left: 9px;
        top: 11px;
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        color: var(--blue);
        background: var(--blue-soft);
        font-size: 12px;
      }
      .task:has(.task-title:nth-child(1)) { }
      .task-title { font-size: 11px; font-weight: 650; color: #21304a; line-height: 1.25; }
      .task-title:has(+ .task-meta) { }
      .task-meta { margin-top: 3px; font-size: 9.5px; color: #7887a1; }
      .task-head > input {
        position: absolute;
        right: 9px;
        top: 17px;
        width: 15px;
        height: 15px;
        accent-color: var(--blue);
      }
      .task:has(input:checked) { opacity: .6; background: #f8fbff; }
      .task:has(input:checked) .task-title { text-decoration: line-through; }
      .task .task-actions {
        display: none;
        position: absolute;
        z-index: 4;
        left: 8px;
        right: 8px;
        bottom: -27px;
        padding: 5px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 7px;
        box-shadow: var(--shadow);
      }
      .task:hover { z-index: 5; border-color: #cdd9ed; }
      .task:hover .task-actions { display: flex; }
      .task-actions button { cursor: pointer; }

      .day > div:nth-last-of-type(3) { margin-top: auto; }
      .progress-wrap, .progress { height: 6px; }
      .progress { background: var(--blue); }
      .day-footer { gap: 7px; flex-wrap: wrap; }
      .day-footer .btn {
        min-height: 28px;
        padding: 5px 7px;
        border: 1px solid var(--line);
        border-radius: 7px;
        font-size: 10px;
      }
      .note-item { font-size: 10px; }

      #dayPanel {
        grid-area: side;
        margin: 0;
        min-width: 0;
        padding: 18px;
        border-radius: 12px;
        box-shadow: var(--shadow);
        align-self: stretch;
      }
      #dayPanel h3 { font-size: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
      .day-quick { grid-template-columns: 1fr; gap: 10px; }
      .big-box {
        margin: 0;
        padding: 16px;
        border-radius: 10px;
        background: #fff;
        box-shadow: none;
      }
      .big-box .label { font-weight: 650; color: #6d7a92; }
      .big-box .value { font-size: 15px; line-height: 1.45; color: #17233a; }
      .big-box:first-child {
        padding: 22px 16px;
        background: linear-gradient(135deg, #f7faff, #fff);
        border-color: #dbe6f7;
      }
      .big-box:first-child .value { font-size: 20px; color: var(--blue); }
      .big-box[style*="grid-column"] .value { font-size: 12px; line-height: 1.7; color: #536581; }

      .shell > .panel:not(#dayPanel) { margin: 0; box-shadow: var(--shadow); }
      .shell > .panel:nth-of-type(3) { grid-area: notes; }
      .shell > .panel:nth-of-type(4) { grid-area: history; }
      textarea { resize: vertical; outline: none; }
      textarea:focus, input:focus, select:focus { border-color: #8fb6ff !important; box-shadow: 0 0 0 3px rgba(23, 105, 245, .08); outline: none; }

      @media (max-width: 1180px) {
        .shell {
          grid-template-columns: 1fr;
          grid-template-areas: "top" "summary" "calendar" "side" "notes" "history";
        }
        .summary { grid-template-columns: repeat(3, 1fr); }
        #dayPanel { min-height: auto; }
        .day-quick { grid-template-columns: repeat(2, 1fr); }
      }

      @media (max-width: 720px) {
        html, body { overflow-x: hidden; }
        .shell { width: 100%; padding: 12px; gap: 12px; }
        .top { min-height: 0; align-items: center; flex-direction: row; flex-wrap: wrap; gap: 8px; }
        .top > div:first-child { width: 100%; min-height: 34px; display: flex; align-items: center; padding-left: 44px; }
        .top > div:first-child::before { top: 0; width: 34px; height: 34px; font-size: 17px; box-shadow: none; }
        h1 { overflow: hidden; font-size: 18px; line-height: 1.1; letter-spacing: -.35px; white-space: nowrap; text-overflow: ellipsis; }
        .top .muted { display: none; }
        .actions { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .actions .btn,
        .actions .btn-primary { grid-column: auto; min-width: 0; min-height: 32px; padding: 0 7px; border-radius: 8px; font-size: 10.5px; box-shadow: none; }

        .summary { display: none; }
        .summary::-webkit-scrollbar { display: none; }
        .summary div {
          flex: 0 0 165px;
          min-height: 82px;
          padding: 15px 10px 12px 55px;
          scroll-snap-align: start;
        }
        .summary div::before { left: 12px; top: 18px; width: 32px; height: 32px; }

        #calendar {
          width: calc(100vw - 24px);
          min-height: 0;
          padding: 48px 10px 14px;
          overflow-x: auto;
          scroll-snap-type: x mandatory;
          scroll-padding-inline: 10px;
          scrollbar-width: none;
          overscroll-behavior-inline: contain;
        }
        #calendar::-webkit-scrollbar { display: none; }
        #calendar::before { left: 14px; top: 15px; font-size: 14px; }
        #calendar::after { content: "Свайп →"; right: 10px; top: 10px; padding: 6px 8px; font-size: 10px; }
        .grid {
          display: flex;
          gap: 10px;
          width: max-content;
        }
        .day {
          flex: 0 0 calc(100vw - 56px);
          width: calc(100vw - 56px);
          min-height: 560px;
          max-height: none;
          scroll-snap-align: center;
          scroll-snap-stop: always;
          padding: 14px;
        }
        .day:first-child::before,
        .day:nth-child(8)::before { display: none; }
        .day:nth-child(8),
        .day:nth-child(n+9) { margin-top: 0; }
        .block { min-height: auto; }
        .schedule-row { grid-template-columns: 18px 84px minmax(0, 1fr); min-height: 23px; }
        .schedule-row time, .schedule-row b { font-size: 10.5px; }
        .task { min-height: 60px; padding-top: 12px; padding-bottom: 11px; }
        .task-title { font-size: 12px; }
        .task-meta { font-size: 10.5px; }
        .task .task-actions {
          position: static;
          display: flex;
          margin: 8px -21px -3px -29px;
          padding: 7px 0 0;
          border: 0;
          border-top: 1px solid #edf0f5;
          border-radius: 0;
          box-shadow: none;
        }
        .task .task-actions button { flex: 1; padding: 5px 3px; }
        .day-footer { display: grid; grid-template-columns: 1fr 1fr; }
        .day-footer .btn { min-height: 34px; }
        .day-footer .btn:last-child { grid-column: 1 / -1; }

        .day-quick { grid-template-columns: 1fr; }
        #dayPanel { padding: 14px; }
        .big-box { padding: 14px; }
        .shell > .panel:not(#dayPanel) { padding: 14px; }
        .modal-backdrop { align-items: flex-end; padding: 0; }
        .modal {
          width: 100%;
          max-height: 92dvh;
          border-radius: 18px 18px 0 0;
          padding: 18px 14px max(18px, env(safe-area-inset-bottom));
        }
        .grid-form { grid-template-columns: 1fr; }
        .field input, .field select, .field textarea { min-height: 44px; font-size: 16px; }
        .actions-right { display: flex; gap: 8px; }
        .actions-right .btn { flex: 1; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div>
          <h1>Двухнедельный трекер режима</h1>
          <div class="muted">Светлый минималистичный MVP с локальным хранением и историей циклов</div>
        </div>
        <div class="actions">
          <button class="btn" id="btnToday">Сегодня</button>
          <button class="btn" id="btnCycle">Настройки</button>
          <button class="btn btn-primary" id="btnShowAll">Календарь</button>
        </div>
      </header>

      <section class="summary" id="cycleSummary"></section>

      <main id="calendar" class="grid"></main>

      <section class="panel" id="dayPanel">
        <h3>Страница дня</h3>
        <div class="day-quick" id="dayDetails"></div>
      </section>

      <section class="panel">
        <h3>Заметки цикла</h3>
        <textarea id="cycleNotesInput" rows="4" placeholder="Мысли по текущему циклу..." style="width:100%; border:1px solid var(--line); border-radius:10px; padding:8px;"></textarea>
        <div class="actions-right"><button class="btn" id="btnSaveCycleNotes">Сохранить заметки цикла</button></div>

      <section class="panel">
        <h3>История циклов</h3>
        <div class="history" id="cycleHistory"></div>
      </section>
    </div>

    <div class="modal-backdrop" id="taskModal">
      <div class="modal">
        <h3 id="taskModalTitle">Задача</h3>
        <div class="grid-form" style="margin-bottom:8px">

    <div class="modal-backdrop" id="settingsModal">
      <div class="modal">
        <h3>Настройки цикла и базового расписания</h3>
        <p class="muted">Здесь можно поправить рабочие слоты, дни зала, структуру 2-недельного шаблона.</p>
        <div class="grid-form" style="margin-bottom:10px">
          <div class="field">

        <div class="field">
          <label>Дни зала</label>
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <label><input type="checkbox" id="gymMon" /> Понедельник</label>
            <label><input type="checkbox" id="gymTue" /> Вторник</label>
            <label><input type="checkbox" id="gymWed" /> Среда</label>

            <label>Неделя 1 (по дням, по одной задаче на строку)</label>
            <textarea id="cfgWeek1" rows="13"></textarea>
          </div>
          <div class="field">

    <div class="modal-backdrop" id="noteModal">
      <div class="modal">
        <h3 id="noteDayLabel"></h3>
        <label class="label">Новая заметка</label>
        <textarea id="noteText" rows="4" style="width:100%; border:1px solid var(--line); border-radius:10px; padding:8px;"></textarea>
        <div class="actions-right">
          <button class="btn" id="noteCancel">Отмена</button>
          <button class="btn btn-primary" id="noteSave">Сохранить</button>
        </div>
      </div>
    </div>

    <script>
      const STORAGE_KEY = "biweekly-productivity-tracker-v5";
      const DAYS_ORDER = ["pn","vt","sr","cht","pt","sb","vs"];
      const TEMPLATE_VERSION = 4;
      const LABEL_DAYS = {
        pn: "Понедельник",
        vt: "Вторник",
        sr: "Среда",
        cht: "Четверг",
        pt: "Пятница",
        sb: "Суббота",
        vs: "Воскресенье",
      };
      const DEFAULT_STATE = {
        config: {
          cycleStart: getDateInput(getCurrentMonday(new Date())),
          wake: "08:00",
          workBlocks: { b1: ["09:30", "12:30"], b2: ["14:00", "17:00"] },
          lunch: ["12:30", "14:00"],
          sleep: "00:00",
          gym: { start: "18:00", end: "20:30", days: ["pn", "sr", "pt"] },
          reading: ["23:00", "23:30"],
          weekTemplates: {
            1: {
              pn: [
                "09:30-11:00|Идеи и сюжеты: ролик №1|youtube-idea",
                "09:30-11:00|Идеи и сюжеты: ролик №2|youtube-idea",
                "09:30-11:00|Идеи и сюжеты: ролик №3|youtube-idea",
                "11:00-12:30|Карта ролика №1 (локации, декорации, NPC, модели, моды, предметы)|youtube-map",
                "14:00-15:30|Продолжить карту ролика №1|youtube-map",
                "15:30-17:00|Начать карту ролика №2|youtube-map"
              ],
              vt: [
                "09:30-11:00|Закончить карту ролика №2|youtube-map",
                "11:00-12:30|Начать карту ролика №3|youtube-map",
                "14:00-17:00|Закончить карту ролика №3|youtube-map"
              ],
              sr: [
                "09:30-12:30|Съёмка ролика №1 (блок 1)|youtube-shoot",
                "14:00-17:00|Продолжение съёмки ролика №1 (блок 2)|youtube-shoot"
              ],
              cht: [
                "09:30-12:30|Съёмка ролика №2|youtube-shoot",
                "14:00-17:00|Продолжение съёмки ролика №2|youtube-shoot"
              ],
              pt: [
                "09:30-12:30|Съёмка ролика №3|youtube-shoot",
                "14:00-17:00|Продолжение съёмки ролика №3|youtube-shoot"
              ],
              sb: [],
              vs: []
            },
            2: {
              pn: [
                "09:30-12:30|Превью ролика №1|youtube-preview",
                "09:30-12:30|Превью ролика №2|youtube-preview",
                "09:30-12:30|Превью ролика №3|youtube-preview",
                "14:00-17:00|Secret Desk / оставшееся время после превью|secret"
              ],
              vt: [
                "09:30-12:30|Secret Desk — рабочий блок №1|secret",
                "14:00-17:00|Secret Desk — рабочий блок №2|secret"
              ],
              sr: [
                "09:30-12:30|Secret Desk — блок №1|secret",
                "14:00-17:00|Secret Desk — блок №2|secret"
              ],
              cht: [
                "09:30-12:30|Secret Desk — блок №1|secret",
                "14:00-17:00|Secret Desk — блок №2|secret"
              ],
              pt: [
                "09:30-12:30|Secret Desk (основной буферный блок)|secret",
                "14:00-17:00|Буфер / досъёмка / переделки|buffer"
              ],
              sb: [],
              vs: []
            }
          }
        },
        currentCycleStart: getDateInput(getCurrentMonday(new Date())),
        cycles: {},
        cycleHistory: []
        ,
        templateVersion: TEMPLATE_VERSION
      };

      const state = loadState();
      let selectedDate = null;
      let editingTask = null;
      let editMode = "add";
      let currentCycle = getCurrentCycleForDate(new Date());
      let selectedCycle = currentCycle.id;

      const el = (id) => document.getElementById(id);

      function getDateInput(date) {
        const localDate = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return localDate.toISOString().slice(0, 10);
      }

      function toMinutes(t) {
        if (!t) return 0;
        const [h, m] = t.split(":").map(Number);
        return h * 60 + m;
      }

      function minutesToText(mins) {
        const safe = Math.max(0, mins);
        const h = Math.floor(safe / 60);
        const m = safe % 60;
        return `${h}ч ${String(m).padStart(2, "0")}м`;
      }

      function formatDateISO(dt) {
        const d = new Date(dt);
        return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "short" });
      }

      function parseTaskLine(line) {
        if (!line || typeof line !== "string") return null;
        const cleaned = line.trim();
        const parts = cleaned.split("|").map((x) => x.trim()).filter(Boolean);
        const [timePart = "", title = "", typeRaw = "other"] = parts;
        const timeMatch = timePart.match(/(\d{2}:\d{2})-(\d{2}:\d{2})/);
        let start = "";
        let end = "";
        let finalTitle = title || "";
        if (!timeMatch && parts.length >= 2) {
          finalTitle = parts[0] || "";
        }
        const rawType = timeMatch ? typeRaw : parts[1] || typeRaw;
        if (timeMatch) {
          start = timeMatch[1];
          end = timeMatch[2];
          finalTitle = title || "";
        } else if (parts[0] && parts[0].includes(":")) {
          const tparts = parts[0].split("|");
          const hasText = tparts.length > 1;
          if (hasText) finalTitle = tparts[1];
        }
        const validTypes = ["work", "other", "youtube-idea", "youtube-map", "youtube-shoot", "youtube-preview", "secret", "gym", "read", "buffer"];
        const normalizedTitle = (rawType + " " + finalTitle).toLowerCase();
        let type = validTypes.includes(rawType) ? rawType : "work";
        if (type === "work") {
          if (normalizedTitle.includes("съёмка")) type = "youtube-shoot";
          if (normalizedTitle.includes("превью")) type = "youtube-preview";
          if (normalizedTitle.includes("карт")) type = "youtube-map";
          if (normalizedTitle.includes("секрет") || normalizedTitle.includes("desk") || normalizedTitle.includes("secret")) type = "secret";
          if (normalizedTitle.includes("зал") || normalizedTitle.includes("трен")) type = "gym";
          if (normalizedTitle.includes("чтение")) type = "read";
        }
        if (!finalTitle) finalTitle = title || cleaned;
        return { title: finalTitle, type, start, end, durationType: ["work", "youtube-idea", "youtube-map", "youtube-shoot", "youtube-preview", "secret", "buffer"].includes(type) ? "work" : "other" };
      }

      function getCurrentMonday(d) {
        const date = new Date(d);
        const day = date.getDay();
        const diff = ((day + 6) % 7);
        date.setDate(date.getDate() - diff);
        date.setHours(0, 0, 0, 0);
        return date;
      }

      function getCurrentCycleForDate(date) {
        const d = new Date(date);
        const base = new Date(state.currentCycleStart);
        const days = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(base.getFullYear(), base.getMonth(), base.getDate())) / 86400000);
        const idx = Math.floor(days / 14);
        const start = new Date(base);
        start.setDate(base.getDate() + idx * 14);
        const end = new Date(start);
        end.setDate(start.getDate() + 13);
        return {
          id: getDateInput(start),
          start: getDateInput(start),
          end: getDateInput(end),
          index: Math.max(0, idx) + 1
        };
      }

      function ensureCycle(cycleId, cycleInfo) {
        if (state.cycles[cycleId]) return;
        const start = new Date(cycleInfo.start);
        const days = [];
        for (let i = 0; i < 14; i++) {
          const date = new Date(start);
          date.setDate(start.getDate() + i);
          const iso = getDateInput(date);
          const dayKey = DAYS_ORDER[date.getDay() === 0 ? 6 : date.getDay() - 1];
          const week = i < 7 ? 1 : 2;
          const template = state.config.weekTemplates[week][dayKey] || [];
          const tasks = [];
          template.forEach((line, tdx) => {
            const parsed = parseTaskLine(line);
            if (!parsed) return;
            tasks.push({ id: crypto.randomUUID(), title: parsed.title, type: parsed.type, start: parsed.start || state.config.workBlocks.b1[0], end: parsed.end || state.config.workBlocks.b2[1], durationType: parsed.durationType || "work", done: false });
          });
          const day = {
            date: iso,
            dayIndex: i + 1,
            type: autoDayType(tasks),
            tasks,
            notes: []
          };
          if (state.config.gym.days.includes(dayKey)) {
            if (!day.tasks.some((t) => t.type === "gym")) day.tasks.push({
              id: crypto.randomUUID(),
              title: "Зал + дорога",
              type: "gym",
              start: state.config.gym.start,
              end: state.config.gym.end,
              done: false
            });
          }
          const readTask = {
            id: crypto.randomUUID(),
            title: "Чтение",
            type: "read",
            start: state.config.reading[0],
            end: state.config.reading[1],
            done: false
          };
          day.tasks.push(readTask);
          days.push(day);
        }
        state.cycles[cycleId] = {
          start: cycleInfo.start,
          end: cycleInfo.end,
          index: cycleInfo.index,
          notes: "",
          days,
          cycleStart: cycleInfo.start,
          metrics: {}
        };
        state.cycleHistory.unshift({ id: cycleId, start: cycleInfo.start, end: cycleInfo.end, archivedAt: new Date().toISOString() });
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
          const parsed = JSON.parse(raw);
          const loaded = {
            ...DEFAULT_STATE,
            ...parsed,
            templateVersion: parsed.templateVersion || 0,
            config: { ...DEFAULT_STATE.config, ...parsed.config, gym: { ...DEFAULT_STATE.config.gym, ...parsed.config.gym }, workBlocks: { ...DEFAULT_STATE.config.workBlocks, ...parsed.config.workBlocks } },
            cycles: parsed.cycles || {}
          };
          if ((loaded.templateVersion || 0) < TEMPLATE_VERSION) {
            loaded.cycles = {};
            loaded.cycleHistory = [];
          }
          loaded.templateVersion = TEMPLATE_VERSION;
          return loaded;
        } catch {
          return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function getCycleOrder() {
        const keys = Object.keys(state.cycles).sort();
        if (keys.length === 0) return [];
        return keys.reverse();
      }

      function getTaskDisplayTime(task) {
        if (task.start && task.end) return `${task.start}-${task.end}`;
        return "без времени";
      }

      function isWorkTask(task) {
        return ["work", "youtube-idea", "youtube-map", "youtube-shoot", "youtube-preview", "secret", "buffer"].includes(task.type);
      }

      function getDayPlanBlocks() {
        const c = state.config;
        return [
          `Подъём: ${c.wake}`,
          `Работа: ${c.workBlocks.b1[0]}–${c.workBlocks.b1[1]}`,
          `Отдых: ${c.lunch[0]}–${c.lunch[1]}`,
          `Работа: ${c.workBlocks.b2[0]}–${c.workBlocks.b2[1]}`,
          `Зал: ${c.gym.start}–${c.gym.end}`,
          `Чтение: ${c.reading[0]}–${c.reading[1]}`,
          `Сон: ${c.sleep}`
        ];
      }

      function getDayTypeLabel(type) {
        return {
          normal: "Смешанный",
          light: "Лёгкий",
          heavy: "Тяжёлый",
          rest: "Выходной",
          "YouTube": "YouTube",
          "Съёмка": "Съёмка",
          "Карты": "Карты",
          "Превью": "Превью",
          "Secret Desk": "Secret Desk",
          "Буфер": "Буфер",
          "Смешанный": "Смешанный"
        }[type] || "Смешанный";
      }

      function autoDayType(tasks) {
        if (!tasks || tasks.length === 0) return "Выходной";
        if (tasks.some((t) => t.type === "buffer")) return "Буфер";
        if (tasks.some((t) => t.type === "youtube-shoot")) return "Съёмка";
        if (tasks.some((t) => t.type === "youtube-map") || tasks.some((t) => t.type === "youtube-idea")) return "Карты";
        if (tasks.some((t) => t.type === "youtube-preview")) return "Превью";
        if (tasks.some((t) => t.type === "secret")) return "Secret Desk";
        if (tasks.some((t) => t.type === "youtube-shoot") && tasks.some((t) => t.type === "secret")) return "Смешанный";
        if (tasks.some((t) => t.title.includes("Зал + дорога")) || tasks.some((t) => t.type === "gym")) return "Смешанный";
        return "YouTube";
      }

      function planByDate() {
        const today = new Date().toISOString().slice(0, 10);
        const cycle = getCurrentCycleForDate(new Date());
        ensureCycle(cycle.id, cycle);
        selectedCycle = cycle.id;
        currentCycle = cycle;
        return state.cycles[selectedCycle].days;
      }

      function dayMetrics(day) {
        const total = day.tasks.length || 1;
        const done = day.tasks.filter((t) => t.done).length;
        const doneMinutes = day.tasks.filter((t) => isWorkTask(t) && t.done).reduce((a, t) => a + Math.max(0, toMinutes(t.end) - toMinutes(t.start)), 0);
        const plannedMinutes = day.tasks.filter((t) => isWorkTask(t)).reduce((a, t) => a + Math.max(0, toMinutes(t.end) - toMinutes(t.start)), 0);
        return { total, done, doneMinutes, plannedMinutes, completedPct: Math.round((done / total) * 100) };
      }

      function nowTime() {
        const now = new Date();
        return now.getHours() * 60 + now.getMinutes();
      }

      function getCurrentBlockLabel(dayDateISO) {
        const c = state.config;
        const minutes = nowTime();
        const times = [
          ["Рабочий блок 1", c.workBlocks.b1],
          ["Обед/отдых", c.lunch],
          ["Рабочий блок 2", c.workBlocks.b2],
          ["Зал", c.gym.days.includes(getDayKey(dayDateISO)) ? [c.gym.start, c.gym.end] : null],
          ["Чтение", c.reading],
          ["Сон", [c.sleep, "24:00"]],
        ];
        const active = times.find(([, arr]) => arr && minutes >= toMinutes(arr[0]) && minutes < toMinutes(arr[1] || "24:00"));
        const next = times.find(([, arr]) => arr && minutes < toMinutes(arr[0]));
        return {
          now: active ? active[0] : "Вне планового времени",
          next: next ? `${next[0]} (${next[1][0]}–${next[1][1]})` : "Следующий блок пока не определён",
        };
      }

      function getDayKey(dateISO) {
        const d = new Date(dateISO);
        const dayIndex = d.getDay();
        return DAYS_ORDER[dayIndex === 0 ? 6 : dayIndex - 1];
      }

      function getTaskTypeLabel(type) {
        return ({
          work: "Работа",
          youtube: "YouTube",
          "youtube-idea": "Идеи и сюжеты",
          "youtube-map": "Карта ролика",
          "youtube-shoot": "Съёмка",
          "youtube-preview": "Превью",
          secret: "Secret Desk",
          buffer: "Буфер",
          gym: "Тренировка",
          read: "Чтение",
          sleep: "Сон",
          other: "Другое"
        })[type] || "Задача";
      }

      function getFullDaySchedule(dayKey) {
        const c = state.config;
        const rows = [
          ["☀", c.wake, "Подъём"],
          ["◷", `${c.workBlocks.b1[0]}–${c.workBlocks.b1[1]}`, "Работа · блок 1"],
          ["☕", `${c.lunch[0]}–${c.lunch[1]}`, "Обед и отдых"],
          ["◷", `${c.workBlocks.b2[0]}–${c.workBlocks.b2[1]}`, "Работа · блок 2"],
          ["✓", `после ${c.workBlocks.b2[1]}`, "Работа закончена"]
        ];
        if (c.gym.days.includes(dayKey)) {
          rows.push(["◇", `${c.gym.start}–${c.gym.end}`, "Зал + дорога"]);
        }
        rows.push(["▤", `${c.reading[0]}–${c.reading[1]}`, "Чтение"]);
        rows.push(["☾", c.sleep, "Сон"]);
        return rows.map(([icon, time, title]) =>
          `<div class="schedule-row"><span>${icon}</span><time>${time}</time><b>${title}</b></div>`
        ).join("");
      }

      function buildDayCard(day) {
        const metrics = dayMetrics(day);
        const key = getDayKey(day.date);
        const selected = selectedDate === day.date;
        const card = document.createElement("article");
        card.className = "day";
        if (day.date === new Date().toISOString().slice(0, 10)) card.classList.add("today");
        if (day.type === "rest") card.classList.add("rest");

        const date = new Date(day.date);
        const dayHeader = document.createElement("div");
        dayHeader.innerHTML = `
          <div class="day-head">
            <div>
              <div class="day-date">${date.toLocaleDateString("ru-RU", { weekday: "short", day: "2-digit", month: "2-digit" })}</div>
              <div class="muted">День цикла: ${day.dayIndex || 0}</div>
              <div class="weekday">${LABEL_DAYS[key]}</div>
            </div>
            <span class="status-tag">${getDayTypeLabel(day.type)}</span>
          </div>
        `;
        card.appendChild(dayHeader);

        const controls = document.createElement("div");
        controls.className = "task-actions";
        controls.innerHTML = `
          <button class="small" data-action="day-type" data-date="${day.date}" data-type="normal">Обычный</button>
          <button class="small" data-action="day-type" data-date="${day.date}" data-type="light">Лёгкий</button>
          <button class="small" data-action="day-type" data-date="${day.date}" data-type="heavy">Тяжёлый</button>
          <button class="small" data-action="day-type" data-date="${day.date}" data-type="rest">Выходной</button>
        `;
        card.appendChild(controls);

        const blocks = document.createElement("div");
        blocks.className = "block";
        blocks.innerHTML = `<strong>Режим дня</strong>${getFullDaySchedule(key)}`;
        card.appendChild(blocks);

        const tasksWrap = document.createElement("div");
        tasksWrap.className = "task-list";
        day.tasks.forEach((task) => {
          const t = document.createElement("div");
          t.className = "task";
          t.innerHTML = `
            <div class="task-head">
              <div>
                <div class="task-title">${task.title} ${task.done ? "✅" : ""}</div>
                <div class="task-meta">${getTaskDisplayTime(task)} · ${getTaskTypeLabel(task.type)}</div>
              </div>
              <input data-action="toggle" data-date="${day.date}" data-id="${task.id}" type="checkbox" ${task.done ? "checked" : ""} />
            </div>
            <div class="task-actions">
              <button class="small" data-action="edit" data-date="${day.date}" data-id="${task.id}">Изменить</button>
              <button class="small" data-action="remove" data-date="${day.date}" data-id="${task.id}">Удалить</button>
              <button class="small" data-action="edit" data-date="${day.date}" data-id="${task.id}" data-move="1">Перенести</button>
            </div>
          `;
          tasksWrap.appendChild(t);
        });
        card.appendChild(tasksWrap);

        const barWrap = document.createElement("div");
        barWrap.innerHTML = `
          <div class="label">Выполнение задач</div>
          <div class="progress-wrap"><div class="progress" style="width:${Math.max(0, Math.min(100, metrics.completedPct))}%"></div></div>
          <div class="label">${metrics.done}/${metrics.total}</div>
        `;
        card.appendChild(barWrap);

        const footer = document.createElement("div");
        footer.className = "day-footer";
        footer.innerHTML = `
          <button class="btn small" data-action="add-task" data-date="${day.date}">Добавить задачу</button>
          <button class="btn small" data-action="add-note" data-date="${day.date}">Добавить заметку</button>
          <button class="btn small" data-action="open-day" data-date="${day.date}">${selected ? "Скрыть задачи дня" : "Открыть день"}</button>
        `;
        card.appendChild(footer);

        const footerNote = document.createElement("div");
        footerNote.className = "footer-note";
        if (day.notes.length) {
          footerNote.innerHTML = `<div class="label">Заметки дня</div>` + day.notes.slice(-2).map((n) => `<div class="note-item">${n.text}</div>`).join("");
        }
        card.appendChild(footerNote);

        card.addEventListener("click", (e) => {
          const target = e.target;
          if (target.matches("button.small") || target.matches("input[type='checkbox']")) {
            return;
          }
          selectedDate = day.date;
          render();
        });
        return card;
      }

      function cycleMetrics(cycle) {
        let doneWork = 0;
        let videos = 0;
        let ytMins = 0;
        let secMins = 0;
        let gym = 0;
        cycle.days.forEach((d) => {
          d.tasks.forEach((t) => {
            if (!t.done) return;
            if (["work", "youtube", "secret"].includes(t.type)) doneWork += 1;
            if (t.type === "youtube") {
              videos += 1;
              ytMins += Math.max(0, toMinutes(t.end) - toMinutes(t.start));
            }
            if (t.type === "secret") secMins += Math.max(0, toMinutes(t.end) - toMinutes(t.start));
            if (t.type === "gym") gym += 1;
          });
        });
        return {
          doneWork,
          videos: Math.ceil(videos / 4), // каждая съёмка/подготовка может включать 1+ задач; сглаживаем
          ytHours: (ytMins / 60).toFixed(1),
          secHours: (secMins / 60).toFixed(1),
          gym
        };
      }

      function renderSummary() {
        const days = planByDate();
        const doneNow = days.filter((d) => d.date === getDateInput(new Date())).shift();
        const completedWork = days.reduce((acc, d) => acc + dayMetrics(d).done, 0);
        const all = days.reduce((acc, d) => acc + dayMetrics(d).total, 0);
        const metrics = cycleMetrics(state.cycles[currentCycle.id]);
        el("cycleSummary").innerHTML = `
          <div><strong>${currentCycle.index} цикл</strong><span>Период: ${currentCycle.start} — ${currentCycle.end}</span></div>
          <div><strong>${state.cycles[currentCycle.id].days.length}</strong><span>Дней в цикле</span></div>
          <div><strong>${doneNow ? dayMetrics(doneNow).done : 0}/${doneNow ? dayMetrics(doneNow).total : 0}</strong><span>Задач выполнено сегодня</span></div>
          <div><strong>${completedWork}/${all}</strong><span>Выполнено задач в цикле</span></div>
          <div><strong>6 ч</strong><span>Лимит рабочих часов/день</span></div>
        `;

        const metricsLine = document.getElementById("dayDetails");
        const selected = doneNow ? doneNow : state.cycles[currentCycle.id].days[0];
        const workNow = selected ? dayMetrics(selected).doneMinutes : 0;
        const remain = Math.max(0, 360 - dayMetrics(selected).plannedMinutes);
        const blocks = getCurrentBlockLabel(selected?.date || getDateInput(new Date()));

        metricsLine.innerHTML = `
          <div class="big-box">
            <div class="label">Что сейчас нужно делать</div>
            <div class="value">${blocks.now}</div>
          </div>
          <div class="big-box">
            <div class="label">Следующий блок</div>
            <div class="value">${blocks.next}</div>
          </div>
          <div class="big-box">
            <div class="label">Выполнено рабочего времени</div>
            <div class="value">${minutesToText(workNow)}</div>
          </div>
          <div class="big-box">
            <div class="label">Осталось (лимит 6ч)</div>
            <div class="value">${minutesToText(remain)}</div>
          </div>
          <div class="big-box" style="grid-column: 1 / -1;">
            <div class="label">Метрики цикла</div>
            <div class="value">Выполнено рабочих задач: ${metrics.doneWork} · Роликов подготовлено: ${metrics.videos} · YouTube: ${metrics.ytHours} ч · Secret Desk: ${metrics.secHours} ч · Тренировок: ${metrics.gym}</div>
          </div>
        `;
      }

      function openModal(mode, date, task = null) {
        editingTask = task;
        editMode = mode;
        el("taskModalTitle").textContent = mode === "edit" ? "Редактировать задачу" : "Новая задача";
        if (task) {
          el("taskTitle").value = task.title || "";
          el("taskType").value = task.type || "work";
          el("taskStart").value = task.start || "";
          el("taskEnd").value = task.end || "";
          el("taskDate").value = task.date || date || "";
          el("taskDone").value = task.done ? "true" : "false";
        } else {
          el("taskTitle").value = "";
          el("taskType").value = "work";
          el("taskStart").value = state.config.workBlocks.b1[0];
          el("taskEnd").value = state.config.workBlocks.b1[1];
          el("taskDate").value = date;
          el("taskDone").value = "false";
        }
        el("workWarning").style.display = "none";
        el("workWarning").textContent = "";
        el("taskModal").classList.add("open");
      }

      function closeTaskModal() {
        el("taskModal").classList.remove("open");
      }

      function upsertTask(date, taskData) {
        const source = state.cycles[currentCycle.id];
        const dayIndex = source.days.findIndex((d) => d.date === date);
        if (dayIndex < 0) return;
        const targetDay = source.days[dayIndex];
        if (editMode === "add") {
          targetDay.tasks.push(taskData);
        } else if (editingTask) {
          const oldDate = editingTask.date;
          if (oldDate !== date) {
            const fromDay = source.days.find((d) => d.date === oldDate);
            if (fromDay) fromDay.tasks = fromDay.tasks.filter((t) => t.id !== editingTask.id);
            targetDay.tasks.push(taskData);
          } else {
            const idx = targetDay.tasks.findIndex((t) => t.id === editingTask.id);
            if (idx >= 0) targetDay.tasks[idx] = taskData;
          }
        }
        const plannedMinutes = dayMetrics(state.cycles[currentCycle.id].days.find((d) => d.date === taskData.date)).plannedMinutes;
        if (isWorkTask(taskData) && plannedMinutes > 360) {
          el("workWarning").style.display = "block";
          el("workWarning").textContent = "⚠ Превышен лимит 6 часов рабочих задач на день. Сохранение разрешено.";
        }
      }

      function buildHistory() {
        const hist = el("cycleHistory");
        const keys = Object.keys(state.cycles)
          .filter((id) => id !== currentCycle.id)
          .sort()
          .reverse();
        if (!keys.length) {
          hist.innerHTML = `<div class="history-item muted">Исторических циклов пока нет.</div>`;
          return;
        }
        hist.innerHTML = "";
        keys.forEach((id) => {
          const c = state.cycles[id];
          const m = cycleMetrics(c);
          const item = document.createElement("div");
          item.className = "history-item";
          item.innerHTML = `<div><strong>Цикл ${c.index || 0}</strong> · ${c.start} — ${c.end}</div>
            <div class="muted">Выполнено рабочих задач: ${m.doneWork} · Роликов: ${m.videos} · YouTube: ${m.ytHours} ч · Secret Desk: ${m.secHours} ч · Тренировки: ${m.gym}</div>`;
          hist.appendChild(item);
        });
      }

      function render() {
        const days = planByDate();
        const grid = el("calendar");
        grid.innerHTML = "";
        days.forEach((day) => {
          const card = buildDayCard(day);
          card.dataset.date = day.date;
          if (selectedDate && selectedDate === day.date) card.style.outline = "2px solid var(--blue)";
          if (selectedDate && day.date !== selectedDate) {
            const d = new Date(day.date);
            if (d.getDay() !== new Date().getDay()) card.style.display = "";
          }
          grid.appendChild(card);
        });

        requestAnimationFrame(() => {
          const selectedCard = Array.from(grid.children).find((card) => card.dataset.date === selectedDate);
          if (selectedCard && window.matchMedia("(max-width: 720px)").matches) {
            selectedCard.scrollIntoView({ behavior: "instant", block: "nearest", inline: "center" });
          }
        });

        if (!selectedDate) selectedDate = days[0]?.date || getDateInput(new Date());
        const note = state.cycles[currentCycle.id].notes || "";
        el("cycleNotesInput").value = note;

        renderSummary();
        buildHistory();
      }

      function initSettingsForm() {
        const c = state.config;
        el("cfgCycleStart").value = state.currentCycleStart;
        el("cfgWake").value = c.wake;
        el("cfgW1Start").value = c.workBlocks.b1[0];
        el("cfgW1End").value = c.workBlocks.b1[1];
        el("cfgLunchStart").value = c.lunch[0];
        el("cfgLunchEnd").value = c.lunch[1];
        el("cfgW2Start").value = c.workBlocks.b2[0];
        el("cfgW2End").value = c.workBlocks.b2[1];
        el("cfgGymStart").value = c.gym.start;
        el("cfgGymEnd").value = c.gym.end;
        el("cfgReadingStart").value = c.reading[0];
        el("cfgReadingEnd").value = c.reading[1];
        el("cfgSleep").value = c.sleep;
        ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach((day, i) => {
          const id = ["gymMon", "gymTue", "gymWed", "gymThu", "gymFri", "gymSat", "gymSun"][i];
          el(id).checked = c.gym.days.includes(DAYS_ORDER[i]);
        });
        el("cfgWeek1").value = DAYS_ORDER.map((d) => `${d}: ${(state.config.weekTemplates[1][d] || []).join(" ; ")}`).join("\n");
        el("cfgWeek2").value = DAYS_ORDER.map((d) => `${d}: ${(state.config.weekTemplates[2][d] || []).join(" ; ")}`).join("\n");
      }

      function parseWeekText(txt, week) {
        const lines = txt.split("\n").map((l) => l.trim()).filter(Boolean);
        const result = { pn: [], vt: [], sr: [], cht: [], pt: [], sb: [], vs: [] };
        const dayMap = { pn: "pn", vt: "vt", sr: "sr", cht: "cht", pt: "pt", sb: "sb", vs: "vs" };
        lines.forEach((line) => {
          const [dayRaw, tasksRaw] = line.split(":");
          const dayKey = dayRaw.trim().toLowerCase();
          if (!dayMap[dayKey]) return;
          result[dayMap[dayKey]] = tasksRaw ? tasksRaw.split(";").map((s) => s.trim()).filter(Boolean) : [];
        });
        return result;
      }

      function handleAction(event) {
        const action = event.target.dataset.action;
        if (!action) return;
        const date = event.target.dataset.date;
        const id = event.target.dataset.id;
        const type = event.target.value;
        if (action === "toggle") {
          const day = state.cycles[currentCycle.id].days.find((d) => d.date === date);
          const task = day?.tasks.find((t) => t.id === id);
          if (task) task.done = !task.done;
          saveState();
          render();
          return;
        }
        if (action === "edit") {
          const day = state.cycles[currentCycle.id].days.find((d) => d.date === date);
          const task = day?.tasks.find((t) => t.id === id);
          if (task) {
            task.date = date;
            openModal("edit", date, task);
          }
          return;
        }
        if (action === "remove") {
          const day = state.cycles[currentCycle.id].days.find((d) => d.date === date);
          if (day) {
            day.tasks = day.tasks.filter((t) => t.id !== id);
            saveState();
            render();
          }
          return;
        }
        if (action === "day-type") {
          const day = state.cycles[currentCycle.id].days.find((d) => d.date === date);
          if (day) {
            day.type = event.target.dataset.type;
            saveState();
            render();
          }
          return;
        }
        if (action === "add-task") {
          editMode = "add";
          openModal("add", date, null);
          return;
        }
        if (action === "open-day") {
          selectedDate = date;
          renderSummary();
          return;
        }
        if (action === "add-note") {
          el("noteDayLabel").textContent = `Заметка к ${date}`;
          el("noteText").value = "";
          el("noteModal").dataset.date = date;
          el("noteModal").classList.add("open");
          return;
        }
      }

      document.addEventListener("click", handleAction);

      el("taskCancel").onclick = () => closeTaskModal();
      el("taskSave").onclick = () => {
        const title = el("taskTitle").value.trim();
        const taskDate = el("taskDate").value;
        if (!title || !taskDate) return;
        const task = {
          id: editingTask?.id || crypto.randomUUID(),
          title,
          type: el("taskType").value,
          start: el("taskStart").value,
          end: el("taskEnd").value,
          done: el("taskDone").value === "true",
          date: taskDate
        };
        upsertTask(taskDate, task);
        saveState();
        render();
        closeTaskModal();
      };

      el("settingsCancel").onclick = () => el("settingsModal").classList.remove("open");
      el("settingsSave").onclick = () => {
        const cycleStart = el("cfgCycleStart").value || getDateInput(new Date());
        const g1 = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((day, i) => ["gymMon", "gymTue", "gymWed", "gymThu", "gymFri", "gymSat", "gymSun"][i]);
        const gymDays = [];
        g1.forEach((id, i) => {
          if (el(id).checked) gymDays.push(DAYS_ORDER[i]);
        });
        state.currentCycleStart = cycleStart;
        state.config.wake = el("cfgWake").value;
        state.config.workBlocks.b1 = [el("cfgW1Start").value, el("cfgW1End").value];
        state.config.workBlocks.b2 = [el("cfgW2Start").value, el("cfgW2End").value];
        state.config.lunch = [el("cfgLunchStart").value, el("cfgLunchEnd").value];
        state.config.gym.start = el("cfgGymStart").value;
        state.config.gym.end = el("cfgGymEnd").value;
        state.config.gym.days = gymDays;
        state.config.reading = [el("cfgReadingStart").value, el("cfgReadingEnd").value];
        state.config.sleep = el("cfgSleep").value;
        state.config.weekTemplates[1] = parseWeekText(el("cfgWeek1").value);
        state.config.weekTemplates[2] = parseWeekText(el("cfgWeek2").value);

        const nowCycle = getCurrentCycleForDate(new Date());
        ensureCycle(nowCycle.id, nowCycle);
        currentCycle = nowCycle;
        selectedCycle = currentCycle.id;
        saveState();
        el("settingsModal").classList.remove("open");
        render();
      };

      el("btnCycle").onclick = () => {
        initSettingsForm();
        el("settingsModal").classList.add("open");
      };
      el("btnShowAll").onclick = () => {
        const last = planByDate();
        const currentIndex = last.findIndex((d) => d.date === selectedDate);
        selectedDate = currentIndex >= 0 ? last[currentIndex].date : getDateInput(new Date());
        render();
      };
      el("btnToday").onclick = () => {
        selectedDate = getDateInput(new Date());
        const targetCycle = getCurrentCycleForDate(new Date());
        ensureCycle(targetCycle.id, targetCycle);
        selectedCycle = targetCycle.id;
        currentCycle = targetCycle;
        render();
      };
      el("btnSaveCycleNotes").onclick = () => {
        state.cycles[currentCycle.id].notes = el("cycleNotesInput").value;
        saveState();
        alert("Заметки цикла сохранены.");
      };

      el("noteCancel").onclick = () => el("noteModal").classList.remove("open");
      el("noteSave").onclick = () => {
        const date = el("noteModal").dataset.date;
        const text = el("noteText").value.trim();
        if (!text || !date) {
          el("noteModal").classList.remove("open");
          return;
        }
        const day = state.cycles[currentCycle.id].days.find((d) => d.date === date);
        if (day) {
          day.notes.unshift({ id: crypto.randomUUID(), text, createdAt: new Date().toISOString() });
          saveState();
          render();
        }
        el("noteModal").classList.remove("open");
      };

      // Init
      const nowCycle = getCurrentCycleForDate(new Date());
      ensureCycle(nowCycle.id, nowCycle);
      currentCycle = nowCycle;
      selectedDate = getDateInput(new Date());
      render();
      saveState();
    </script>
  </body>
</html>
